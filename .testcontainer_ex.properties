# testcontainer_ex project properties.
#
# Reuse lets the ClickHouse container survive between suite runs, so `mix test`
# does not pay ClickHouse's ~10s boot every time. Without it every run starts a
# fresh container and leaves the old one behind.
#
# Nothing here is load-bearing for correctness: the suite works either way, it is
# only slower and leaks containers. Remove the container when you want a clean
# slate — `podman ps --filter ancestor=clickhouse/clickhouse-server:26.9`.
testcontainer_ex.reuse.enable=true
