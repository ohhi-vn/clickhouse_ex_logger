services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_logger_test
    ports:
      - "8123:8123"
    # Keep the data in a named volume so a restart does not force a re-migrate,
    # but `mix clickhouse_logger.migrate` is idempotent either way.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data: